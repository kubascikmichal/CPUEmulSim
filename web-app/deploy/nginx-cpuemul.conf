# nginx site for the CPU Emulator (TLS termination + reverse proxy to the app on 127.0.0.1:8080).
# Install as /etc/nginx/sites-available/cpuemul (Debian/Ubuntu) or /etc/nginx/conf.d/cpuemul.conf
# (Fedora/RHEL); replace cpuemul.example.sk and the certificate paths.

server {
    listen 80;
    listen [::]:80;
    server_name cpuemul.example.sk;
    # certbot's HTTP challenge, everything else to HTTPS
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name cpuemul.example.sk;

    ssl_certificate     /etc/letsencrypt/live/cpuemul.example.sk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cpuemul.example.sk/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # uploads are code / schematic files (the app allows 2 MB per file)
    client_max_body_size 3m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
