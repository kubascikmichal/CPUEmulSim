# Apache 2.4 site for the CPU Emulator (TLS termination + reverse proxy to the app on 127.0.0.1:8080).
# Alternative to nginx-cpuemul.conf - use one of the two.
#
# Debian/Ubuntu: /etc/apache2/sites-available/cpuemul.conf, then
#   a2enmod proxy proxy_http ssl headers rewrite && a2ensite cpuemul && systemctl reload apache2
# Fedora/RHEL:   /etc/httpd/conf.d/cpuemul.conf (modules are loaded by default; mod_ssl: dnf install mod_ssl)
# Replace cpuemul.example.sk and the certificate paths.

<VirtualHost *:80>
    ServerName cpuemul.example.sk

    # certbot's HTTP challenge, everything else to HTTPS
    Alias /.well-known/acme-challenge/ /var/www/letsencrypt/.well-known/acme-challenge/
    <Directory /var/www/letsencrypt/.well-known/acme-challenge/>
        Require all granted
    </Directory>
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName cpuemul.example.sk

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/cpuemul.example.sk/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/cpuemul.example.sk/privkey.pem
    SSLProtocol -all +TLSv1.2 +TLSv1.3

    # Upload size: the app itself rejects files over files.maxFileBytes (2 MB) with 413.
    # (Apache 2.4 does not apply LimitRequestBody to proxied request bodies, so it is not set here.)

    # the app sees the browser's host and the HTTPS scheme; X-Forwarded-For is added by mod_proxy
    ProxyRequests Off
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    ProxyTimeout 60
    ProxyPass        / http://127.0.0.1:8080/
    ProxyPassReverse / http://127.0.0.1:8080/

    # Debian/Ubuntu define APACHE_LOG_DIR; on Fedora/RHEL use logs/cpuemul-error.log and logs/cpuemul-access.log
    ErrorLog  ${APACHE_LOG_DIR}/cpuemul-error.log
    CustomLog ${APACHE_LOG_DIR}/cpuemul-access.log combined
</VirtualHost>
